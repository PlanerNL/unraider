name: APK bouwen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # nodig om bij een tag een Release te maken

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Gradle wrapper uitvoerbaar maken
        run: chmod +x gradlew

      # Als de secret KEYSTORE_BASE64 bestaat: ondertekende release-APK.
      # Anders: debug-APK (werkt ook, maar zie README over updates).
      - name: Keystore klaarzetten
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "dir=release" >> "$GITHUB_OUTPUT"
          else
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "dir=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Bouwen
        env:
          SIGNING_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Lege variabele = niet ondertekenen
          [ -z "$SIGNING_KEYSTORE_PATH" ] && unset SIGNING_KEYSTORE_PATH
          ./gradlew ${{ steps.keystore.outputs.task }} --stacktrace

      - name: APK hernoemen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/${{ steps.keystore.outputs.dir }}/*.apk \
             "out/Unraider-${{ steps.keystore.outputs.dir }}-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Unraider-apk
          path: out/*.apk

      - name: Release maken (alleen bij een tag zoals v0.1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
